<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#03030a; --deep:#0b0a1c; --glow:#2a0c25; --text:#e9e1e6; --soft:#a99fb0;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;height:100%;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 108%,var(--glow) 0%,transparent 70%),
    radial-gradient(ellipse 90% 70% at 50% 62%,var(--deep) 0%,var(--void) 80%) var(--void);
  color:var(--text);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.void{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 38%)}
main{
  position:relative;z-index:1;height:100%;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:2rem 1.6rem;text-align:center;
}
.quote{max-width:30ch;margin:0;font-style:italic;font-weight:500;
  font-size:clamp(1.55rem,6.2vw,2.5rem);line-height:1.38;letter-spacing:.005em;
  text-shadow:0 2px 22px rgba(0,0,10,.95)}
.quote span{display:block;margin-bottom:.9em;opacity:0;transform:translateY(6px);
  animation:rise 2.6s ease forwards}
.quote span:nth-child(1){animation-delay:1.2s}
.quote span:nth-child(2){animation-delay:4.6s}
.quote span:nth-child(3){animation-delay:8.2s}
.sign{margin:1.4em 0 0;font-size:clamp(1.1rem,4vw,1.4rem);font-style:italic;color:var(--soft);
  opacity:0;animation:rise 3s ease 12.4s forwards;text-shadow:0 2px 16px rgba(0,0,10,.95)}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .quote span,.sign{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="void" aria-hidden="true"></div>
<main>
  <p class="quote">
    <span>I love you… and no one, not even God himself, will take you from me.</span>
    <span>Because even in the next lifetime, I will hunt you. I’ll find you.</span>
    <span>And I will spend eternity protecting you.</span>
  </p>
  <p class="sign">For you.</p>
</main>
<script>
(function(){
  var cv=document.getElementById('c'),ctx=cv.getContext('2d');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W,H,dpr,cx,cy,maxR,stars=[],shoot=null,nextShoot=0,rot=0;

  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth;H=window.innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    cx=W/2;cy=H*.62;maxR=Math.hypot(W,H);
  }
  function init(){
    size();
    var n=Math.round(Math.min(260,Math.max(120,W*H/5200)));
    stars=[];
    for(var i=0;i<n;i++){
      var warm=Math.random()<.08;
      stars.push({
        a:Math.random()*6.283,
        r:Math.sqrt(Math.random())*maxR*.95,
        s:.4+Math.random()*1.3,
        ph:Math.random()*6.283,
        sp:.01+Math.random()*.03,
        base:.35+Math.random()*.55,
        col:warm?'255,170,180':(Math.random()<.3?'190,205,255':'245,240,255')
      });
    }
  }
  function drawStars(t){
    for(var i=0;i<stars.length;i++){
      var st=stars[i],ang=st.a+rot;
      var x=cx+Math.cos(ang)*st.r,y=cy+Math.sin(ang)*st.r*.82;
      if(x<-5||x>W+5||y<-5||y>H+5)continue;
      var tw=reduce?1:.65+.35*Math.sin(t*st.sp+st.ph);
      var d=Math.hypot(x-cx,y-cy)/Math.max(W,H);
      var fade=Math.min(1,.25+d*1.8);
      ctx.globalAlpha=st.base*tw*fade;
      ctx.fillStyle='rgb('+st.col+')';
      ctx.beginPath();ctx.arc(x,y,st.s,0,6.283);ctx.fill();
      if(st.s>1.3){
        ctx.globalAlpha*=.25;
        ctx.beginPath();ctx.arc(x,y,st.s*2.6,0,6.283);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
  }
  function drawShoot(t){
    if(!shoot&&t>nextShoot){
      var sx=Math.random()*W*.8+W*.1,sy=Math.random()*H*.35;
      shoot={x:sx,y:sy,vx:6+Math.random()*3,vy:2.4+Math.random()*1.6,life:0};
    }
    if(!shoot)return;
    shoot.life+=1;
    shoot.x+=shoot.vx;shoot.y+=shoot.vy;
    var a=Math.sin(Math.PI*Math.min(1,shoot.life/70));
    var g=ctx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);
    g.addColorStop(0,'rgba(255,240,245,'+(.85*a)+')');
    g.addColorStop(1,'rgba(255,240,245,0)');
    ctx.strokeStyle=g;ctx.lineWidth=1.4;
    ctx.beginPath();ctx.moveTo(shoot.x,shoot.y);
    ctx.lineTo(shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);ctx.stroke();
    if(shoot.life>70||shoot.x>W+50||shoot.y>H+50){
      shoot=null;nextShoot=t+7000+Math.random()*7000;
    }
  }
  var t0=performance.now();
  function frame(now){
    var t=now-t0;
    ctx.clearRect(0,0,W,H);
    rot+=.00006;
    drawStars(t/16);
    drawShoot(t);
    requestAnimationFrame(frame);
  }
  init();
  nextShoot=9000;
  if(reduce){drawStars(0)}else{requestAnimationFrame(frame)}
  window.addEventListener('resize',function(){init();if(reduce){ctx.clearRect(0,0,W,H);drawStars(0)}});
})();
</script>
</body>
</html>
